schema_version: 1

context:
  version: "2.1.16"

package:
  name: pyglet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyglet/pyglet-${{ version }}.tar.gz
  sha256: ca90ee05532ced8330b8a8087ac2a7b69589b7fa7fb67f85aabe24aaf4ae42c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}

tests:
  - files:
      recipe:
        - run_tests.py
    requirements:
      run:
        - if: linux
          then: libglu
        - python ${{ python_min }}.*
        - pip
    script:
      - pip check
      - if: not linux
        then: python run_tests.py
      - if: linux
        then: xvfb-run --server-args=":99 -screen 0 1024x768x24 -ac +extension GLX -noreset" python run_tests.py

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Cross-platform windowing and multimedia library
  homepage: http://pyglet.org
  repository: https://github.com/pyglet/pyglet

extra:
  recipe-maintainers:
    - mwcraig
    - jakirkham
    - bitcraft
    - hmaarrfk  # just a maintainer to help move things forward. Happy to retire myself
